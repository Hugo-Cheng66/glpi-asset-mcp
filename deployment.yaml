apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-asset-mcp
  labels:
    app: glpi-asset-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi-asset-mcp
  template:
    metadata:
      labels:
        app: glpi-asset-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: glpi-asset-mcp
          image: glpi-asset-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: glpi-asset-mcp-secret
          env:
            - name: GLPI_REPORTS_DIR
              value: /app/reports
            - name: GLPI_REQUEST_TIMEOUT_SECONDS
              value: "30"
          volumeMounts:
            - name: reports
              mountPath: /app/reports
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: glpi-asset-mcp-reports

